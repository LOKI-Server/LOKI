[workspace]
members = ["crates/loki-server", "crates/loki-sdk", "crates/cargo-loki", "crates/xtask"]
default-members = ["crates/loki-server", "crates/cargo-loki"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Aspenini"]
repository = "https://github.com/LOKI-Server/LOKI"
license = "MIT"

[workspace.dependencies]
loki-sdk = { version = "0.4.0", path = "crates/loki-sdk", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
