[package]
name = "cargo-loki"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Scaffold, build, package, and develop portable LOKI plugins"
readme = "README.md"

[dependencies]
anyhow = "1"
# Plain Windows paths in output and generated Cargo.toml files.
dunce = "1"
clap = { version = "4", features = ["derive", "env"] }
loki-sdk = { workspace = true, features = ["manifest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "9.2", default-features = false, features = ["deflate"] }
wasmparser = "0.252"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart"] }
rand = "0.8"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
