<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a100d"><title>LOKI — your services, held together</title>
<link rel="stylesheet" href="{{ assets }}/style.css">
<link rel="icon" sizes="32x32" href="{{ assets }}/icon-32.png"><link rel="icon" sizes="256x256" href="{{ assets }}/icon-256.png"><link rel="apple-touch-icon" href="{{ assets }}/icon-256.png">
{% for module in modules %}<link rel="modulepreload" href="{{ assets }}/{{ module }}">
{% endfor %}<script type="module" src="{{ assets }}/app.js"></script>
{% if let Some(boot) = boot %}<script type="application/json" id="boot">{{ boot|safe }}</script>
{% endif %}</head>
<body><a class="skip" href="#main">Skip to content</a><div class="yggdrasil" aria-hidden="true"></div>
<aside id="sidebar"><a class="brand" href="/" aria-label="LOKI home"><span class="rune" aria-hidden="true">ᛉ</span><span class="brand-name">LOKI<small>YOUR OWN UNIVERSE</small></span></a><nav id="navigation" aria-label="Main navigation"></nav><div class="sidebar-footer"><span class="futhark" aria-hidden="true">ᛚ ᛟ ᚲ ᛁ</span><span><span class="status-dot"></span>Self-hosted. Yours.</span><small>LOKI {{ version }}</small></div></aside>
<div id="workspace"><header class="topbar"><span id="server-name"></span><div id="identity"></div></header><main id="main" tabindex="-1" aria-busy="true"><div class="skeleton-page" aria-label="Loading"><div class="sk sk-eyebrow"></div><div class="sk sk-title"></div><div class="sk sk-line"></div><div class="sk-grid"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div></div></main><footer class="page-footer"><span class="knot" aria-hidden="true"></span>Your services, held together.</footer></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"><button id="dialog-close" class="icon-button" type="button" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="dialog-body"></div></dialog>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="actions"><button value="yes" id="confirm-yes"></button><button value="no" class="subtle">Cancel</button></div></form></dialog>
<noscript><p class="notice">Enable JavaScript to use the LOKI dashboard.</p></noscript></body></html>
