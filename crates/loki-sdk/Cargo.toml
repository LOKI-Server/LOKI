[package]
name = "loki-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Build portable Rust plugins for LOKI with typed host services"
readme = "README.md"
include = ["src/**", "wit/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["guest"]
guest = ["dep:wasi", "dep:wit-bindgen", "dep:form_urlencoded", "dep:percent-encoding", "dep:serde_urlencoded", "dep:getrandom", "dep:base64"]
templates = ["guest", "dep:askama"]
manifest = ["dep:semver"]
testing = ["guest"]
realtime = ["guest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasi = { version = "0.14", optional = true }
wit-bindgen = { version = "0.57", optional = true }
form_urlencoded = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
getrandom = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
askama = { version = "0.12", default-features = false, optional = true }
semver = { version = "1", optional = true }
